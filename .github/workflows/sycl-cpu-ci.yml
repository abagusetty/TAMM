name: SYCL CPU CI

# Sanity-verifies the DPCPP/SYCL build on a CPU-only GitHub-hosted runner
# using the Intel OpenCL CPU device (no GPU present, none needed).
# oneAPI 2026.2.0 (icx/icpx/ifx, MKL, TBB, OpenCL runtime) comes from
# apt.repos.intel.com/oneapi (conda channel max is 2025.0.4); conda provides
# only OpenMPI/OpenBLAS/HDF5/CMake. Nothing is built from source except TAMM.
#
# Production TAMM builds AOT-compile for Intel PVC (GPU_ARCH=intel_gpu_pvc
# with -fsycl-targets=intel_gpu_pvc); that cannot run here, so the build
# requests GPU_ARCH=spir64 to get a generic spir64 JIT image the OpenCL CPU
# device can execute. TAMM_CXX_FLAGS is overridden to drop Aurora-specific
# -march=sapphirerapids tuning that is irrelevant on GH runners.
#
# Triggers:
# Production (after this branch merges): TAMM_CI + SYCL CI run in parallel
# on every push/PR (both workflows file on main). During branch testing we
# keep push/pull_request only on this feature branch so TAMM_CI is suppressed
# (see c-cpp.yaml branches-ignore) and only SYCL CI runs.
#   - push / pull_request: parallel with TAMM_CI (final state)
#   - workflow_run: optional CI-driven after TAMM_CI (kept for dispatch)
#   - workflow_dispatch / issue_comment @sycl-runner: manual

on:
  workflow_dispatch: {}
  push:
    branches:
      - "feature/sycl-cpu-ci-2026.2.0"
      - "feature/sycl*"
      - "sycl*"
      - main
    paths-ignore:
      - docs/**
      - "*.md"
  pull_request:
    branches:
      - main
      - "feature/sycl*"
      - "sycl*"
    paths-ignore:
      - docs/**
      - "*.md"
  workflow_run:
    workflows: ["TAMM_CI"]
    types: [completed]
    branches: [main, "sycl*"]
  repository_dispatch:
    types: [backend_automation]
  issue_comment:
    types: [created]

permissions:
  # contents: write lets the log-upload step push to a ci-logs-* branch.
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: sycl-cpu-ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  ONEAPI_DEVICE_SELECTOR: "opencl:cpu"
  OMP_NUM_THREADS: "2"
  SYCL_CACHE_PERSISTENT: "1"
  SYCL_CACHE_DIR: "/tmp/sycl_cache"
  CCACHE_DIR: "/home/runner/.ccache"
  CCACHE_MAXSIZE: "6G"
  OMPI_MCA_rmaps_base_oversubscribe: "1"
  OMPI_MCA_pml: "ob1"
  OMPI_MCA_btl: "self,vader,tcp"
  OMPI_MCA_btl_tcp_if_include: "lo"
  OMPI_MCA_oob_tcp_if_include: "lo"
  UCX_TLS: "tcp"
  OMPI_ALLOW_RUN_AS_ROOT: "1"
  OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: "1"
  TAMM_GPU_POOL: "10"
  TAMM_CPU_POOL: "10"

jobs:
  build-and-test:
    # workflow_run: only on success of TAMM_CI
    # issue_comment: only on @sycl-runner
    if: |
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
      (github.event_name != 'issue_comment' || contains(github.event.comment.body, '@sycl-runner'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Acknowledge "@sycl-runner" comment
        if: github.event_name == 'issue_comment'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket',
            });

      - name: Checkout TAMM
        uses: actions/checkout@v4
        with:
          # For issue_comment on a PR, build that PR's head. For workflow_run,
          # checkout the head SHA of the triggering run's branch.
          ref: ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request && format('refs/pull/{0}/head', github.event.issue.number) || github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
          fetch-depth: 1

      - name: Create conda environment (OpenMPI + tools)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: .github/sycl-cpu-ci-env.yml
          cache-downloads: true
          cache-environment: false
          post-cleanup: none

      - name: Install Intel oneAPI 2026.2.0 (apt)
        run: |
          set -o pipefail; mkdir -p /tmp/logs
          {
            wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB | gpg --dearmor | sudo tee /usr/share/keyrings/oneAPI.gpg > /dev/null
            echo "deb [signed-by=/usr/share/keyrings/oneAPI.gpg] https://apt.repos.intel.com/oneapi all main" | sudo tee /etc/apt/sources.list.d/oneAPI.list
            sudo apt-get update
            # 2026.2.0 packages verified via apt Packages; TBB/OpenCL have different naming
            sudo apt-get install -y \
              intel-oneapi-compiler-dpcpp-cpp-2026.2 \
              intel-oneapi-compiler-fortran-2026.2 \
              intel-oneapi-mkl-devel-2026.2 \
              intel-oneapi-tbb-devel \
              intel-oneapi-runtime-opencl
            # Source oneAPI env for subsequent steps in this job
            source /opt/intel/oneapi/setvars.sh
            icpx --version; icx --version; ifx --version
            ls /opt/intel/oneapi/mkl/latest/lib/*sycl* | head
          } 2>&1 | tee /tmp/logs/05_oneapi_apt.log
          # Persist for next steps via $GITHUB_ENV
          echo "ONEAPI_ROOT=/opt/intel/oneapi" >> $GITHUB_ENV
          echo "MKLROOT=/opt/intel/oneapi/mkl/latest" >> $GITHUB_ENV
          echo "TBBROOT=/opt/intel/oneapi/tbb/latest" >> $GITHUB_ENV
          echo "CMPLR_ROOT=/opt/intel/oneapi/compiler/latest" >> $GITHUB_ENV
          echo "/opt/intel/oneapi/compiler/latest/bin" >> $GITHUB_PATH
          echo "/opt/intel/oneapi/mkl/latest/bin" >> $GITHUB_PATH

      - name: Toolchain and OpenCL CPU device
        run: |
          set -o pipefail; mkdir -p /tmp/logs
          source /opt/intel/oneapi/setvars.sh || true
          {
            echo "=== compilers ==="
            which icpx icx ifx cmake ninja mpirun
            icpx --version
            icx --version
            ifx --version
            cmake --version
            ninja --version
            mpirun --version || mpiexec --version || true
            echo "=== oneAPI env ==="
            echo "MKLROOT=$MKLROOT CMPLR_ROOT=$CMPLR_ROOT ONEAPI_ROOT=$ONEAPI_ROOT"
            echo "=== SYCL devices ==="
            sycl-ls || true
            # micromamba list filtered
            micromamba list | grep -E 'openmpi|cmake|ccache|openblas|hdf5' || true
            dpkg -l | grep -E 'intel-oneapi.*2026.2' || true
            # Verify 2026.2.0 pin
            icpx --version | head -n1
            # Minimal SYCL probe: compile and run a trivial queue on opencl:cpu
            cat > /tmp/sycl_probe.cpp <<'EOF'
          #include <sycl/sycl.hpp>
          #include <iostream>
          int main(){
            sycl::queue q{sycl::cpu_selector_v};
            std::cout << "SYCL device: " << q.get_device().get_info<sycl::info::device::name>() << "\n";
            std::cout << "SYCL vendor: " << q.get_device().get_info<sycl::info::device::vendor>() << "\n";
            int data=0; { sycl::buffer<int,1> b(&data,1); q.submit([&](sycl::handler& h){ auto a=b.get_access<sycl::access::mode::write>(h); h.single_task([=](){ a[0]=42; }); }); }
            std::cout << "SYCL probe result=" << data << "\n";
            return data==42 ? 0 : 1;
          }
          EOF
            icpx -fsycl /tmp/sycl_probe.cpp -o /tmp/sycl_probe && /tmp/sycl_probe
          } 2>&1 | tee /tmp/logs/10_toolchain.log
          cat /tmp/logs/10_toolchain.log

      - name: Restore ccache (TAMM C++/SYCL objects)
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.ccache
          key: sycl-ccache-v2-${{ runner.os }}-${{ hashFiles('.github/sycl-cpu-ci-env.yml') }}-${{ github.sha }}
          restore-keys: |
            sycl-ccache-v2-${{ runner.os }}-${{ hashFiles('.github/sycl-cpu-ci-env.yml') }}-
            sycl-ccache-v2-${{ runner.os }}-

      - name: Build TAMM (DPCPP SYCL, JIT spir64, CPU-runnable)
        env:
          CC: icx
          CXX: icpx
          FC: ifx
          MKLROOT: /opt/intel/oneapi/mkl/latest
          TBBROOT: /opt/intel/oneapi/tbb/latest
        run: |
          set -o pipefail; mkdir -p /tmp/logs
          source /opt/intel/oneapi/setvars.sh
          # Ensure conda MPI takes precedence over Intel MPI (avoid libfabric clash)
          export PATH="$CONDA_PREFIX/bin:$PATH"
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib:$LD_LIBRARY_PATH"
          echo "MKLROOT=$MKLROOT"
          echo "CONDA_PREFIX=$CONDA_PREFIX"
          echo "CMPLR_ROOT=$CMPLR_ROOT"
          echo "PATH=$PATH"
          echo "MPIEXEC=$(which mpiexec) ($(mpiexec --version 2>&1 | head -n1))"
          cmake --version
          # TAMM uses CMakeBuild superbuild; GPU_ARCH=spir64 requests generic JIT
          # image. TAMM_CXX_FLAGS override drops Aurora SPR tuning.
          # Use Intel MKL from oneAPI (as in build_exachem_sunspot.sh:24) — OpenBLAS conda lacks ilp64
          # Use Unix Makefiles (not Ninja) — TAMM superbuild uses DESTDIR= ninja fails with DESTDIR target
          cmake -B build \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/install \
            -DALLOW_CONDA=ON \
            -DLINALG_VENDOR=IntelMKL \
            -DLINALG_PREFIX=$MKLROOT \
            -DMPIEXEC_EXECUTABLE=$CONDA_PREFIX/bin/mpiexec \
            -DTAMM_ENABLE_DPCPP=ON \
            -DGPU_ARCH=spir64 \
            -DTAMM_CXX_FLAGS="" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=icx \
            -DCMAKE_CXX_COMPILER=icpx \
            -DCMAKE_Fortran_COMPILER=ifx \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBUILD_TESTING=ON \
            2>&1 | tee /tmp/logs/40_tamm_configure.log
          # Verify no PVC AOT target leaked in cache
          echo "=== GPU_ARCH / SYCL targets in cache ===" | tee -a /tmp/logs/40_tamm_configure.log
          grep -i -E 'GPU_ARCH|fsycl-targets|TAMM_ENABLE_DPCPP|TAMM_CXX_FLAGS' build/CMakeCache.txt | tee -a /tmp/logs/40_tamm_configure.log || true
          if grep -q 'intel_gpu_pvc' build/CMakeCache.txt; then
            echo "WARNING: intel_gpu_pvc still present in CMakeCache.txt (expected spir64 JIT)" | tee -a /tmp/logs/40_tamm_configure.log
          fi
          make -C build -j2 2>&1 | tee /tmp/logs/41_tamm_build.log
          make -C build install 2>&1 | tee -a /tmp/logs/41_tamm_build.log
          ccache -s 2>&1 | tee -a /tmp/logs/41_tamm_build.log || true

      - name: Save ccache (even on failure)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.ccache
          key: sycl-ccache-v2-${{ runner.os }}-${{ hashFiles('.github/sycl-cpu-ci-env.yml') }}-${{ github.sha }}

      - name: Smoke - ctest (SYCL CPU)
        timeout-minutes: 30
        run: |
          set -o pipefail; mkdir -p /tmp/logs
          source /opt/intel/oneapi/setvars.sh
          export PATH="$CONDA_PREFIX/bin:$PATH"
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib:$LD_LIBRARY_PATH"
          {
            echo "=== ctest env ==="
            echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"
            echo "MKLROOT=$MKLROOT"
            echo "MPIEXEC=$(which mpiexec) ($(mpiexec --version 2>&1 | head -n1))"
            ldconfig -p | grep -E 'mkl|ifport|ifcore' | head -n 20 || true
            ls /opt/intel/oneapi/compiler/latest/lib/libifport* 2>&1 | head -n 5 || true
            ldd $GITHUB_WORKSPACE/build/TAMM_Tests_External-prefix/src/TAMM_Tests_External-build/Test_Tensors 2>&1 | grep -E 'mpi|fabric|ifport' | head -n 10 || true
            echo "=== ctest ==="
            # Ensure Intel runtime libs visible (libifport.so.5 etc.) but conda MPI first
            ctest --test-dir build -V --output-on-failure 2>&1 | head -n 800
            echo "=== sycl cache ==="
            ls -lh /tmp/sycl_cache 2>&1 | head -n 20 || true
          } 2>&1 | tee /tmp/logs/50_ctest.log

      - name: Upload logs as run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sycl-cpu-ci-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/logs/*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish logs to ci-logs branch (readable without API auth)
        if: always() && github.event_name != 'workflow_run' && github.event_name == 'push'
        continue-on-error: true
        run: |
          mkdir -p /tmp/logs /tmp/ci-logs && cd /tmp/ci-logs
          for f in /tmp/logs/*.log; do [ -e "$f" ] && tail -n 1200 "$f" > "$(basename "$f")"; done
          ls -la
          git init -q -b main .
          git config user.email "ci@github-runner" && git config user.name "sycl-cpu-ci logs"
          git add -A
          git commit -q -m "logs for run ${{ github.run_id }} (attempt ${{ github.run_attempt }}) sha ${{ github.sha }}" --allow-empty
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:refs/heads/ci-logs-${{ github.run_id }}
