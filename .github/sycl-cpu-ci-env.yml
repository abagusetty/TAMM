# Conda environment for .github/workflows/sycl-cpu-ci.yml — MPI/utils only.
# Intel oneAPI 2026.2.0 (icx/icpx/ifx, MKL, TBB, OpenCL runtime) is installed
# via apt from apt.repos.intel.com/oneapi (conda max is 2025.0.4, see CI logs).
# Keep conda for OpenMPI/OpenBLAS/HDF5/CMake/ninja/ccache.
name: sycl-ci
channels:
  - conda-forge
dependencies:
  - python=3.12
  - cmake>=3.26
  - ninja
  - ccache
  - pkg-config
  - openmpi
  - openblas
  - hdf5
  - scipy
  - numpy
